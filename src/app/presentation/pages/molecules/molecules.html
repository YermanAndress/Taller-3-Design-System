<dsb-container-atom title="Button Group" >
    <dsb-button-group-molecule 
        [buttonsGroupData]="buttonsGroupData" 
        (clicker)="onClick($event)" >
    </dsb-button-group-molecule>
</dsb-container-atom>

<dsb-container-atom title="Nav Link" >
    <dsb-nav-link-molecule [navLinks]="navLinks">
    </dsb-nav-link-molecule>
</dsb-container-atom>

<dsb-container-atom title="Product Rating (custom)" >
    <section class="d-flex flex-column gap-3" >
        @for(item of productRatings; track item){
            <div>
                <p class="mb-1 fw-semibold">{{ item.productName }}</p>
                <app-product-rating [data]="item.data"></app-product-rating>
            </div>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Card Header" >
    <section class="d-flex flex-column gap-3" >
        @for(item of cardHeaders; track item){
            <dsb-card-header-molecule
                [imageUrl]="item.imageUrl"
                [title]="item.title"
                [discountText]="item.discountText">
            </dsb-card-header-molecule>
        }
    </section>
</dsb-container-atom>
