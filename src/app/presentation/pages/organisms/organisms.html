<dsb-container-atom title="Navbar" >
    <dsb-navbar-organism [navbarConfig]="navbarConfig"></dsb-navbar-organism>
</dsb-container-atom>

<dsb-container-atom title="Product Cards" >
    <section class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3" >
        @for(card of productCards; track card.title){
            <div class="col" >
                <dsb-product-card-organism
                    [imageUrl]="card.imageUrl"
                    [title]="card.title"
                    [discountText]="card.discountText"
                    [rating]="card.rating"
                    [reviewsCount]="card.reviewsCount"
                    [price]="card.price"
                    (addToCart)="onAddToCart($event)">
                </dsb-product-card-organism>
            </div>
        }
    </section>
</dsb-container-atom>
